name: industrial-copilot

services:
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: copilot-db
    env_file: .env
    ports: ["5432:5432"]
    volumes:
      - db-data:/home/postgres/pgdata
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
      - ./data/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mqtt:
    image: eclipse-mosquitto:2
    container_name: copilot-mqtt
    ports: ["1883:1883"]
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: copilot-redis
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
  mqtt-data:
  redis-data:
